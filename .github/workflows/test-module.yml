name: Test cgMLST heatmap module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy biopython plotly

      - name: Run Python syntax check
        run: python -m py_compile modules/local/allelic-heatmap/bin/allelic_heatmap.py modules/local/allelic-distribution/bin/allelic_distribution.py run_cghm.py

      - name: Run Nextflow syntax check
        uses: nf-core/setup-nextflow@v2
        with:
          version: "24.04.6"
      - name: Run Nextflow syntax check
        run: nextflow run main.nf -c config.nf --dry-run

      - name: Run pipeline against test data
        run: |
          nextflow run main.nf -c config.nf
      - name: Verify outputs
        run: |
          find work -type f -name "*.tsv" -o -name "*.html" | xargs wc -l
